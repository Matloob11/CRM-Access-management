# A7 Org & Security console — Hostinger vhost.
# Install as /etc/nginx/conf.d/a7-org-manager.conf, then obtain a cert:
#   certbot certonly --webroot -w /var/www/a7-org-manager-acme -d org.srv1802669.hstgr.cloud
# and reload nginx. Modelled on a7-recordings-ops.conf; keep the two in step.

upstream a7_org_manager_app {
    server 127.0.0.1:8790;
}

server {
    listen 80;
    listen [::]:80;
    server_name org.srv1802669.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-org-manager-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name org.srv1802669.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/org.srv1802669.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/org.srv1802669.hstgr.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:a7org:10m;

    # Rendered only inside the Bitrix placement iframe: allow that origin, no other.
    add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/a7-org-manager.access.log;
    error_log  /var/log/nginx/a7-org-manager.error.log;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/a7-org-manager-acme;
    }

    # Bitrix placement panel (static). Bitrix opens the handler with a POST; the
    # 405 -> 200 mapping makes the menu item render the static boot page instead
    # of erroring. The boot page then redirects to the console at /org.
    location /app/ {
        alias /opt/a7-org-manager/panel/;
        index index.html;
        error_page 405 =200 $uri;

        add_header Content-Security-Policy "frame-ancestors https://crm.a7grouprealestatedxb.com" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Everything else is the console app.
    location / {
        proxy_pass http://a7_org_manager_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        error_page 405 =200 $uri;
    }
}
