<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A7 · Company Structure &amp; Access</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

    <div class="app">
      <nav class="rail glass" aria-label="App sections">
        <div class="mark" aria-hidden="true">A7</div>
        <a class="nav-link" data-page="teams" href="#/" aria-label="Teams">
          <svg class="ic" viewBox="0 0 24 24"><path d="M16 19a4 4 0 00-8 0M12 11a3 3 0 100-6 3 3 0 000 6zM4 19a3 3 0 015-2M20 19a3 3 0 00-5-2M6 11a2 2 0 100-4 2 2 0 000 4zM18 11a2 2 0 100-4 2 2 0 000 4z"/></svg>
          <span class="tip">Teams</span>
        </a>
        <a class="nav-link" data-page="roles" href="#/roles" aria-label="Roles">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4 9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
          <span class="tip">Roles &amp; access</span>
        </a>
        <a class="nav-link" data-page="verify" href="#/verify" aria-label="Verify">
          <svg class="ic" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
          <span class="tip">Verify</span>
        </a>
        <a class="nav-link" data-page="help" href="#/help" aria-label="Help">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>
          <span class="tip">How access works</span>
        </a>
        <div class="sp"></div>
        <div class="av me" id="meAvatar" title="Checking session…">…</div>
      </nav>

      <div class="main">
        <header class="top glass">
          <span class="crumb" id="topCrumb"></span>
          <h1 id="topTitle">Teams</h1>
          <div class="search pill" id="searchBox">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="q" placeholder="Search team or leader" autocomplete="off" />
          </div>
          <div class="sp"></div>
          <div class="top-actions" id="topActions"></div>
        </header>

        <main id="view">
          <div class="loading"><span class="spinner"></span> Starting…</div>
        </main>
      </div>
    </div>

    <script type="module">
      import { start } from "/static/js/app.js";
      start().catch(function (err) {
        var el = document.getElementById("view");
        if (el) {
          el.innerHTML =
            '<div class="note bad">App failed to start. Reload the page. ' +
            String(err && err.message ? err.message : err) +
            "</div>";
        }
      });
    </script>
  </body>
</html>
